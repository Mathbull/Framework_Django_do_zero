{% extends '_layout.html' %}

{% block content %}

    <div class="card">
        <div class="card-header">
            <h5 class="card-title">Criando a pergunta</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{form.as_p}} 

                <button type="submit" class="btn btn-success">Enviar </button>
            </form>
        </div>
    </div>

{% endblock %}
