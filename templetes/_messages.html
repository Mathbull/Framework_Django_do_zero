<!-- Layout que irá resceber as mensagens e estilo bootrap -->

{% for menssage in messages %}

    <div class="container-fluid p-0">
        <div class="alert alert-{{ menssage.tags }} alert-dismissble" role="alert">
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="close">

            </button>
            {{ menssage }}
        </div>
        
    </div>

{% endfor %}
